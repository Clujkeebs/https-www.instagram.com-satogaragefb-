<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Custom deck">
<defs>
  <filter id="r" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="53" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A211A"/><stop offset="1" stop-color="#191310"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EFD27E"/><stop offset="0.5" stop-color="#C9A227"/>
    <stop offset="1" stop-color="#8A6A18"/>
  </linearGradient>
</defs>
<rect width="800" height="800" fill="#0E0D0C"/>
<circle cx="400" cy="400" r="300" fill="#171513"/>

<g filter="url(#r)" transform="translate(400 400)">
  <g transform="rotate(-14)">
    <!-- shadow -->
    <path d="M-108 -300 C-64 -330 64 -330 108 -300 C124 -288 124 -262 116 -244
             L116 244 C124 262 124 288 108 300 C64 330 -64 330 -108 300
             C-124 288 -124 262 -116 244 L-116 -244 C-124 -262 -124 -288 -108 -300 Z"
          fill="#000" opacity="0.55" transform="translate(14 18)"/>
    <!-- deck -->
    <path d="M-108 -300 C-64 -330 64 -330 108 -300 C124 -288 124 -262 116 -244
             L116 244 C124 262 124 288 108 300 C64 330 -64 330 -108 300
             C-124 288 -124 262 -116 244 L-116 -244 C-124 -262 -124 -288 -108 -300 Z"
          fill="url(#wood)" stroke="#0A0908" stroke-width="6"/>
    
  <g stroke="#C9A227" stroke-width="3" stroke-dasharray="12 10" fill="none" opacity="0.85">
    <path d="M-96 -250 L96 -250 M-96 250 L96 250 M0 -300 L0 300"/>
    <circle cx="0" cy="0" r="70"/>
  </g>
  <text x="0" y="-14" font-family="Impact, Haettenschweiler, sans-serif" font-size="120"
        fill="#F0E4D2" text-anchor="middle" opacity="0.9">?</text>
  <text x="0" y="150" font-family="Impact, Haettenschweiler, sans-serif" font-size="40"
        fill="#C89B6C" text-anchor="middle" letter-spacing="4">YOUR</text>
  <text x="0" y="196" font-family="Impact, Haettenschweiler, sans-serif" font-size="40"
        fill="#C89B6C" text-anchor="middle" letter-spacing="4">GRAPHIC</text>

    <!-- ply edge highlight -->
    <path d="M-116 -244 L-116 244 M116 -244 L116 244" stroke="#C89B6C" stroke-width="3" opacity="0.35"/>
  </g>
</g>
</svg>
