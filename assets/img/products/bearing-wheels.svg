<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Bearing wheels">
<defs>
  <filter id="r" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A211A"/><stop offset="1" stop-color="#191310"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EFD27E"/><stop offset="0.5" stop-color="#C9A227"/>
    <stop offset="1" stop-color="#8A6A18"/>
  </linearGradient>
</defs>
<rect width="800" height="800" fill="#0E0D0C"/>
<circle cx="400" cy="400" r="300" fill="#171513"/>

<g filter="url(#r)" transform="translate(400 400)">
  <g stroke="#0A0908" stroke-width="7">
    <g fill="#EDE7DC">
      <circle cx="-110" cy="-110" r="88"/><circle cx="110" cy="-110" r="88"/>
      <circle cx="-110" cy="110" r="88"/><circle cx="110" cy="110" r="88"/>
    </g>
    <g fill="#C9A227">
      <circle cx="-110" cy="-110" r="30"/><circle cx="110" cy="-110" r="30"/>
      <circle cx="-110" cy="110" r="30"/><circle cx="110" cy="110" r="30"/>
    </g>
    <g fill="#171310">
      <circle cx="-110" cy="-110" r="12"/><circle cx="110" cy="-110" r="12"/>
      <circle cx="-110" cy="110" r="12"/><circle cx="110" cy="110" r="12"/>
    </g>
  </g>
  <g fill="none" stroke="#C89B6C" stroke-width="4" opacity="0.5">
    <circle cx="-110" cy="-110" r="60"/><circle cx="110" cy="-110" r="60"/>
    <circle cx="-110" cy="110" r="60"/><circle cx="110" cy="110" r="60"/>
  </g>
</g>
</svg>
