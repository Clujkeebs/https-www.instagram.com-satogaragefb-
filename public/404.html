<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Sato Garage</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d0e10'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='Impact,sans-serif' fill='%23ff6b1a'>SG</text></svg>"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">SG</span>
          <span data-site="name">Sato Garage</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          Menu
        </button>

        <nav class="nav" id="primary-nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/order">Order Custom</a>
          <a class="btn btn--primary" href="/order">Start a build</a>
        </nav>
      </div>
    </header>

    <main class="error-page">
      <div class="wrap">
        <div class="code">404</div>
        <h1>Wrong bay</h1>
        <p>
          That page is not in the shop. Try the home page, or head straight to
          the order form.
        </p>
        <div class="btn-row btn-row--center">
          <a class="btn btn--primary" href="/">Home</a>
          <a class="btn btn--ghost" href="/order">Order Custom</a>
        </div>
      </div>
    </main>

    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
